name: Deploy to Hugging Face

on:
  push:
    branches: [main]
    paths:
      - "DevOpsDataOps/e2e_demo_app/**"
      - ".github/workflows/main.yml"

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Hugging Face CLI
        run: |
          python -m pip install --upgrade huggingface_hub

      - name: Verify application
        run: |
          test -f DevOpsDataOps/e2e_demo_app/app.py
          test -f DevOpsDataOps/e2e_demo_app/requirements.txt
      - name: Verify Hugging Face authentication
        env:
          HF_TOKEN: ${{ secrets.HG }}
        run: |
          hf auth whoami
      - name: Deploy to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HG }}
        run: |
          hf upload Cordova520/demo2 \
            DevOpsDataOps/e2e_demo_app \
            . \
            --repo-type space \
            --commit-message "Deploy from GitHub Actions"
