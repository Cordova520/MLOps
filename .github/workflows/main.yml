name: Deploy to Hugging Face

on:
  push:
    branches: [main]
    paths:
      - "DevOpsDataOps/e2e_demo_app"
      - ".github/workflows/main.yaml"

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hugging Face CLI
        run: |
          python -m pip install --upgrade huggingface_hub

      - name: Initialize submodule
        env:
          HF_TOKEN: ${{ secrets.HF }}
        run: |
          git -c credential.helper='!f() { echo username=Cordova520; echo "password=$HF_TOKEN"; }; f' \
            submodule update --init --depth 1 -- DevOpsDataOps/e2e_demo_app

      - name: Deploy to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF }}
        run: |
          hf upload Cordova520/demo2 \
            DevOpsDataOps/e2e_demo_app \
            . \
            --repo-type space
