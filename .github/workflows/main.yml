name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]
    paths:
      - "DevOpsDataOps/e2e_demo_app"
      - ".github/workflows/main.yaml"

  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Install Hugging Face CLI
        run: |
          python -m pip install --upgrade huggingface_hub

      - name: Download application submodule
        env:
          HF_TOKEN: ${{ secrets.HF }}
        run: |
          git -c credential.helper='!f() { echo username=Cordova520; echo "password=$HF_TOKEN"; }; f' \
            submodule update --init --depth 1 -- DevOpsDataOps/e2e_demo_app

      - name: Verify application
        run: |
          ls -la DevOpsDataOps/e2e_demo_app
          test -f DevOpsDataOps/e2e_demo_app/app.py

      - name: Sync application to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF }}
        run: |
          hf upload Cordova520/demo2 \
            DevOpsDataOps/e2e_demo_app \
            . \
            --repo-type space
