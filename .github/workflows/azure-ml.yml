name: Azure Connection Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  azure-login:
    runs-on: ubuntu-latest

    steps:
      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure connection
        run: az account show --output table
        
      - name: Install Azure ML extension
        run: az extension add --name ml --yes
      
      - name: Verify Azure ML Workspace
        run: |
          az ml workspace show \
            --name "${{ vars.AZURE_ML_WORKSPACE }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --output table
      
